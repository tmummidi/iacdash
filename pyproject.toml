[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tarun-energyplan"
version = "0.1.0"
description = "Industrial energy investment decisions under budget and risk"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "scipy==1.13.1"]
license = {file = "LICENSE"}

[project.scripts]
energyplan = "energyplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["energyplan*"]
